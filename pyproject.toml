[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-dna"
version = "1.0.0"
description = "Sparse matrix generation with DNA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kapil Dhinwa", email = "kapildhinwa2010@gmail.com"}
]
keywords = ["sparse", "neural-networks", "dna", "pytorch", "compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pytorch",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/SparseDNA"
Repository = "https://github.com/kapildhinwa2010-dev/SparseDNA.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparse_dna*"]
